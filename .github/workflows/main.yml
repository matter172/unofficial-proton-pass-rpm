name: Update Proton Pass RPM Repository

on:
  schedule:
    - cron: '0 0 * * *'   # every day at 00:00 UTC
  workflow_dispatch:

env:
  VERSIONS_TO_KEEP: 5   # number of releases to retain; older ones are pruned automatically

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-repo:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq createrepo-c

      - name: Fetch manifest and check for new version
        id: check_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MANIFEST_URL="https://proton.me/download/PassDesktop/linux/x64/version.json"
          if ! VERSION_DATA=$(curl -fsSL --retry 3 "$MANIFEST_URL"); then
            echo "::error::Failed to fetch Proton's manifest from $MANIFEST_URL"
            exit 1
          fi

          # The manifest lists Beta builds alongside Stable ones (often first), so only take Stable
          RELEASE=$(echo "$VERSION_DATA" | jq -c 'first(.Releases[]? | select(.CategoryName == "Stable")) // empty')
          if [ -z "$RELEASE" ]; then
            echo "::error::No Stable release found in Proton's manifest - the API may have changed."
            exit 1
          fi

          VERSION=$(echo "$RELEASE" | jq -r '.Version // empty')
          # Pick the first .rpm entry so URL and checksum always come from the same file
          RPM_ENTRY=$(echo "$RELEASE" | jq -c 'first(.File[]? | select(.Url // "" | endswith(".rpm"))) // empty')
          DOWNLOAD_URL=$(echo "$RPM_ENTRY" | jq -r '.Url // empty')
          EXPECTED_SHA512=$(echo "$RPM_ENTRY" | jq -r '.Sha512CheckSum // empty')

          if [ -z "$VERSION" ] || [ -z "$DOWNLOAD_URL" ] || [ -z "$EXPECTED_SHA512" ]; then
            echo "::error::Could not find version, .rpm URL or SHA512 in Proton's manifest - the API may have changed."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          echo "expected_sha512=$EXPECTED_SHA512" >> "$GITHUB_OUTPUT"

          # A release only counts as existing if it has an RPM attached. If an earlier run
          # created the release but the upload failed, the RPM is uploaded to it again.
          if RPM_COUNT=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets \
                --jq '[.assets[].name | select(endswith(".rpm"))] | length' 2>/dev/null); then
            if [ "$RPM_COUNT" -gt 0 ]; then
              EXISTING="true"
            else
              echo "::warning::Release v$VERSION exists but has no RPM attached; uploading it again."
              EXISTING="false"
              echo "release_incomplete=true" >> "$GITHUB_OUTPUT"
            fi
          else
            EXISTING="false"
          fi
          echo "release_exists=$EXISTING" >> "$GITHUB_OUTPUT"

          if [ "$EXISTING" = "true" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "Release v$VERSION already exists, nothing to do."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download new RPM and create GitHub Release
        if: steps.check_version.outputs.should_publish == 'true' && steps.check_version.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed as env vars (not pasted into the script) so manifest values are never run as shell code
          VERSION: ${{ steps.check_version.outputs.version }}
          DOWNLOAD_URL: ${{ steps.check_version.outputs.download_url }}
          EXPECTED_SHA512: ${{ steps.check_version.outputs.expected_sha512 }}
          RELEASE_INCOMPLETE: ${{ steps.check_version.outputs.release_incomplete }}
        run: |
          FILENAME=$(basename "$DOWNLOAD_URL")

          echo "Downloading $FILENAME..."
          if ! curl -fsSL --retry 3 "$DOWNLOAD_URL" -o "$FILENAME"; then
            echo "::error::Failed to download $DOWNLOAD_URL"
            rm -f "$FILENAME"
            exit 1
          fi

          ACTUAL_SHA512=$(sha512sum "$FILENAME" | awk '{print $1}')
          if [ "$ACTUAL_SHA512" != "$EXPECTED_SHA512" ]; then
            echo "::error::Checksum mismatch for $FILENAME"
            echo "expected: $EXPECTED_SHA512"
            echo "got:      $ACTUAL_SHA512"
            rm -f "$FILENAME"
            exit 1
          fi

          # GPL-3.0 corresponding source. Proton tags releases in ProtonMail/WebClients as
          # proton-pass@<version>; only link the tag if it exists and its pass-desktop
          # package.json carries the same version, otherwise fall back to the directory.
          SOURCE_REPO="ProtonMail/WebClients"
          SOURCE_TAG="proton-pass@$VERSION"
          SOURCE_DIR_URL="https://github.com/$SOURCE_REPO/tree/main/applications/pass-desktop"
          if SOURCE_COMMIT=$(gh api "repos/$SOURCE_REPO/commits/$SOURCE_TAG" --jq '.sha' 2>/dev/null) \
             && TAGGED_VERSION=$(gh api "repos/$SOURCE_REPO/contents/applications/pass-desktop/package.json?ref=$SOURCE_COMMIT" \
                  --jq '.content' 2>/dev/null | base64 -d | jq -r '.version') \
             && [ "$TAGGED_VERSION" = "$VERSION" ]; then
            SOURCE_TEXT="Source for this release: tag [$SOURCE_TAG](https://github.com/$SOURCE_REPO/tree/$SOURCE_TAG/applications/pass-desktop) (commit [${SOURCE_COMMIT:0:12}](https://github.com/$SOURCE_REPO/tree/$SOURCE_COMMIT/applications/pass-desktop)) in $SOURCE_REPO."
          else
            echo "::warning::No matching $SOURCE_TAG tag found in $SOURCE_REPO; linking the pass-desktop directory instead."
            SOURCE_TEXT="Source: [applications/pass-desktop]($SOURCE_DIR_URL) in $SOURCE_REPO. Proton has not published a $SOURCE_TAG tag, so use the revision matching Proton Pass version $VERSION."
          fi

          # Unquoted heredoc: variables expand once and their values are not re-evaluated.
          # Literal backticks would be command substitution here, so code blocks use ~~~.
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES_FILE" << EOF
          Unmodified official Proton Pass $VERSION RPM built by Proton AG, mirrored by an unofficial community repository. This project is not affiliated with or endorsed by Proton AG.

          **Package:** $FILENAME
          **Downloaded from:** $DOWNLOAD_URL

          **SHA512** (from Proton's manifest https://proton.me/download/PassDesktop/linux/x64/version.json, verified before upload):

          ~~~
          $EXPECTED_SHA512
          ~~~

          ### Source code
          Proton Pass is free software released under the [GNU General Public License v3.0](https://www.gnu.org/licenses/gpl-3.0.html).
          $SOURCE_TEXT

          ### License
          - Proton Pass: [GPL-3.0](https://www.gnu.org/licenses/gpl-3.0.html). See [COPYING-PROTON-PASS.md](https://github.com/$GITHUB_REPOSITORY/blob/main/COPYING-PROTON-PASS.md).
          - This repository's scripts and workflow: MIT. See [LICENSE](https://github.com/$GITHUB_REPOSITORY/blob/main/LICENSE).

          "Proton" and "Proton Pass" are trademarks of Proton AG.
          EOF

          if [ "$RELEASE_INCOMPLETE" = "true" ]; then
            echo "Checksum OK. Uploading $FILENAME to existing release v$VERSION..."
            gh release upload "v$VERSION" "$FILENAME" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES_FILE"
          else
            echo "Checksum OK. Creating GitHub Release v$VERSION..."
            gh release create "v$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Proton Pass $VERSION (unofficial mirror)" \
              --notes-file "$NOTES_FILE" \
              "$FILENAME"
          fi

      - name: Prune old releases
        if: steps.check_version.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Sort by version number, not createdAt: GitHub sets a release's createdAt to the
          # date of the tagged commit, so releases tagged on the same commit tie and the
          # newest one could be pruned. Only vX.Y.Z tags are considered, so manual releases are left alone.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            | jq -r --argjson keep "$VERSIONS_TO_KEEP" '
                map(select(.tagName | test("^v[0-9]+(\\.[0-9]+)*$")))
                | sort_by(.tagName | ltrimstr("v") | split(".") | map(tonumber))
                | reverse | .[$keep:] | .[].tagName' \
            | while read TAG; do
                echo "Pruning old release $TAG..."
                gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              done

      - name: Download all release assets and build repo
        if: steps.check_version.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p x86_64

          echo "Fetching all release tags..."
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            | jq -r '.[].tagName' | while read TAG; do
              echo "Downloading assets for $TAG..."
              gh release download "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "*.rpm" \
                --dir x86_64 \
                --clobber
            done

          echo "RPMs collected:"
          ls -lh x86_64/

      - name: Regenerate repository metadata
        if: steps.check_version.outputs.should_publish == 'true'
        run: createrepo_c x86_64/

      - name: Setup Pages
        if: steps.check_version.outputs.should_publish == 'true'
        uses: actions/configure-pages@v5

      - name: Build clean Pages directory
        if: steps.check_version.outputs.should_publish == 'true'
        run: |
          mkdir -p _site
          cp -r x86_64 _site/
          cp setup.sh _site/ 2>/dev/null || true

      - name: Upload Pages artifact
        if: steps.check_version.outputs.should_publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        if: steps.check_version.outputs.should_publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4